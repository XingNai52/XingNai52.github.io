name: Deploy VCPedia Realm

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download the published website bundle
        run: curl --fail --location --retry 3 --retry-delay 2 "https://github.com/${{ github.repository }}/releases/latest/download/vcpedia-pages.zip" --output site.zip
      - name: Unpack the website
        run: mkdir site && unzip -q site.zip -d site && test -f site/dist/index.html && test -f site/dist/404.html
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
